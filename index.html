<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="css/agendamento.css">
    <link rel="stylesheet" href="css/pesquisa.css">
</head>

<body>
    <header>
        <h1>Agendamento de Clientes</h1>
    </header>

    <section class="container">
        <form id="my-form">
            <h1>Adicionar Usuário</h1>
            <div>
                <label for="name">Nome</label>
                <input type="text" id="name" required>
            </div>
            <div>
                <label for="email">E-mail</label>
                <input type="text" id="email" required>
            </div>

            <div><label for="horario">Horário: </label>
                <select name="hours" id="horario">
                    <option value="------">------</option>
                    <option value="09:00h">09:00</option>
                    <option value="10:00h">10:00</option>
                    <option value="11:00h">11:00</option>
                    <option value="12:00h">12:00</option>
                </select>
            </div>
            <input type="submit" value="enviar" class="btn">
        </form>
        <ul id="users"></ul>
    </section>

    <script src="javascript/script.js"></script>
    <script src="javascript/pesquisa.js"></script>
</body>

</html>
